<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackVis</title>

    <link rel="stylesheet" href="./styles/css/style.css?v=79">
    <link rel="stylesheet" href="./styles/css/nationality-filter.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-fixes.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-closed-state.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-scroll-size.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-foreign-test.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-grid.css?v=1">
    <link rel="stylesheet" href="./styles/css/nationality-button-spacing.css?v=8">
    <link rel="stylesheet" href="./styles/css/nationality-reset-icon.css?v=1">
    <link rel="stylesheet" href="./styles/css/axes-filter-responsive.css?v=7">
    <link rel="stylesheet" href="./styles/css/search-filter-svg.css?v=8">
    <link rel="stylesheet" href="./styles/css/year-filter-svg.css?v=3">
    <link rel="stylesheet" href="./styles/css/filter-counts.css?v=1">
    <link rel="stylesheet" href="./styles/css/search-selection-back.css?v=3">
    <link rel="stylesheet" href="./styles/css/filter-overflow-fix.css?v=1">
    <link rel="stylesheet" href="./styles/css/person-card.css?v=1">
    <link rel="icon" href="./assets/Adinkra-01.png" type="image/png">
</head>
<body>

    <nav class="top-nav">
        <span class="nav-link" id="nav-home">Home</span>
        <div class="nav-center">
            <div class="nav-logo-flip" id="nav-logo">
                <span class="nav-logo-text">BlackVis</span>
                <img src="assets/Adinkra-01.png" alt="BlackVIS" class="nav-logo-img" width="36" height="36">
            </div>
        </div>
        <span class="nav-link" id="nav-sobre">Sobre</span>
    </nav>

    <div id="content-wrapper">

        <!-- Área do grafo -->
        <div class="graph-area">
            <button id="search-results-back" type="button" aria-label="Voltar aos resultados da pesquisa" hidden><img src="assets/icons/back-off.svg" alt="" width="64" height="64"></button>
            <div class="grafico-container">
                <svg id="grafico-d3"></svg>
            </div>
        </div>

        <!-- Painel de informações — 30% -->
        <div class="info-panel">
            <div id="card" class="card">

                <!-- Conteúdo: técnica ou área de design -->
                <div id="card-tec-area" style="display:none"></div>

                <!-- Conteúdo: perfil de pessoa -->
                <div id="card-pessoa" style="display:none">
                    <div class="card-p-top">
                        <div class="card-p-foto"></div>
                        <div class="card-p-summary">
                        <h2 id="card-p-nome"></h2>
                        <div id="card-p-tecnicas"></div>
                        <div class="card-p-campos">
                            <p class="card-campo">
                                <span class="campo-label">Nascimento</span>
                                <span id="card-p-nasc" class="campo-valor"></span>
                            </p>
                        </div>
                        <div id="card-p-local" class="card-p-locations"></div>
                        </div>
                    </div>
                    <p id="card-p-bio"></p>
                    <section id="card-p-works" hidden aria-label="Obras">
                        <h3>Obras</h3>
                        <div class="card-p-work-list" aria-label="Galeria de obras"></div>
                    </section>
                    <a id="btn-link-externo" class="btn" style="display:none"></a>
                </div>

            </div>
        </div>

    </div>

    <footer class="bottom-bar menu" aria-label="Menu de filtros">
        <button id="menu-help" class="menu-help" type="button" aria-label="Ajuda">?</button>

        <section class="menu-section menu-nationality" aria-label="Filtro de nacionalidade">
            <div class="menu-section-title">Nacionalidade <span id="nationality-count" class="menu-count">000</span></div>
            <div class="nationality-filters">
                <button class="nat-btn" data-value="Brasileira">
                    <img src="assets/icons/iconBR.svg" class="nat-icon" alt="">
                    <span>Brasileiro</span>
                </button>
                <button class="nat-btn" data-value="Estrangeira">
                    <img src="assets/icons/iconEXT.svg" class="nat-icon" alt="">
                    <span>Estrangeiro</span>
                </button>
                <button id="menu-reset" class="menu-reset" type="button" aria-label="Limpar filtros">
                    <svg viewBox="0 0 40 30" aria-hidden="true" focusable="false">
                        <rect class="reset-background" width="40" height="30" rx="15"/>
                        <path class="reset-symbol" d="M27.5003 15C27.5014 15.9853 27.3078 16.9612 26.9304 17.8714C26.5531 18.7816 25.9995 19.6082 25.3015 20.3038C24.6061 21.001 23.7798 21.5539 22.87 21.9308C21.9603 22.3077 20.985 22.5012 20.0003 22.5C19.0152 22.5 18.0398 22.3059 17.1298 21.9288C16.2198 21.5518 15.393 20.9991 14.6965 20.3025C14.0127 19.6196 13.4673 18.8111 13.0903 17.9212C13.0376 17.8072 13.0084 17.6838 13.0043 17.5583C13.0002 17.4328 13.0214 17.3077 13.0666 17.1906C13.1118 17.0734 13.1801 16.9665 13.2674 16.8762C13.3547 16.786 13.4593 16.7142 13.5749 16.6651C13.6905 16.616 13.8147 16.5906 13.9403 16.5905C14.0659 16.5904 14.1902 16.6155 14.3059 16.6643C14.4216 16.7132 14.5263 16.7847 14.6138 16.8748C14.7013 16.9649 14.7698 17.0717 14.8153 17.1888C15.1015 17.86 15.5065 18.4625 16.0228 18.9762C16.5378 19.4937 17.1403 19.8987 17.8115 20.185C18.5052 20.4743 19.2493 20.6233 20.0009 20.6233C20.7525 20.6233 21.4966 20.4743 22.1903 20.185C22.8579 19.9018 23.4644 19.4922 23.9765 18.9787C24.4995 18.4565 24.9143 17.8363 25.1974 17.1536C25.4806 16.4709 25.6264 15.7391 25.6265 15C25.6276 14.2612 25.4824 13.5296 25.1995 12.8471C24.9165 12.1647 24.5013 11.545 23.9778 11.0237C23.4652 10.5091 22.8577 10.0986 22.189 9.815C21.4954 9.52568 20.7512 9.37672 19.9996 9.37672C19.2481 9.37672 18.5039 9.52568 17.8103 9.815C16.7971 10.2435 15.9318 10.9597 15.3215 11.875H17.8115C18.0602 11.875 18.2986 11.9738 18.4744 12.1496C18.6503 12.3254 18.749 12.5639 18.749 12.8125C18.749 13.0611 18.6503 13.2996 18.4744 13.4754C18.2986 13.6512 18.0602 13.75 17.8115 13.75H13.4365C13.1879 13.75 12.9494 13.6512 12.7736 13.4754C12.5978 13.2996 12.499 13.0611 12.499 12.8125V8.4375C12.499 8.18886 12.5978 7.9504 12.7736 7.77459C12.9494 7.59877 13.1879 7.5 13.4365 7.5C13.6852 7.5 13.9236 7.59877 14.0994 7.77459C14.2753 7.9504 14.374 8.18886 14.374 8.4375V10.04C14.4774 9.92167 14.5853 9.80708 14.6978 9.69625C15.3803 9.01255 16.1884 8.46714 17.0778 8.09C18.0026 7.70203 18.9955 7.50222 19.9984 7.50222                     </svg>
                </button>
            </div>
            <div class="location-filter-viewport">
            <div class="location-filter-viewport">
                <div id="location-filters" class="location-filters" hidden aria-live="polite"></div>
                <div class="location-scrollbar" aria-hidden="true"><span class="location-scrollbar-thumb"></span></div>
            </div>
                <div class="location-scrollbar" aria-hidden="true"><span class="location-scrollbar-thumb"></span></div>
            </div>
        </section>

        <section class="menu-section menu-axes" aria-label="Filtros por eixos do design">
            <div class="menu-section-title">Eixos do Design <span id="axes-count" class="menu-count" aria-hidden="true"></span><button id="axes-reset" class="menu-reset" type="button" aria-label="Limpar filtros"></button></div>
            <div class="bb-center">
                <button class="category-btn" data-value="Comunicação" style="--cat-color: #628CD9"><span class="menu-count">0</span><img src="assets/icons/comunica/Adinkra_Comunicação.png" alt=""><b>comunicação</b></button>
                <button class="category-btn" data-value="Produto" style="--cat-color: #FADA71"><span class="menu-count">0</span><img src="assets/icons/produ/Adinkra-05.png" alt=""><b>produto</b></button>
                <button class="category-btn" data-value="Teórico" style="--cat-color: #56B250"><span class="menu-count">0</span><img src="assets/icons/teori/Adinkra_Teórico.png" alt=""><b>teórico</b></button>
                <button class="category-btn" data-value="Interação" style="--cat-color: #E578BA"><span class="menu-count">0</span><img src="assets/icons/intera/Adinkra_Interação.png" alt=""><b>interação</b></button>
                <button class="category-btn" data-value="Serviço" style="--cat-color: #E58967"><span class="menu-count">0</span><img src="assets/icons/servi/Adinkra_Serviço.png" alt=""><b>serviço</b></button>
            </div>
        </section>

        <section class="menu-section menu-controls" aria-label="Busca e período">
            <div class="search-wrapper">
                <input type="search" id="search-input" placeholder="Pesquisa por nome" aria-label="Pesquisa por nome">
                <span id="search-count" class="menu-count" aria-hidden="true"></span>
                <button id="toggle-all-names" class="menu-icon-button" type="button" aria-label="Mostrar todos os nomes" aria-pressed="false">
                    <img class="names-icon names-icon-off" src="assets/icons/ver-nomes-off.svg" alt="">
                    <img class="names-icon names-icon-on" src="assets/icons/ver-nomes-on.svg" alt="">
                </button>
            </div>
            <div class="year-section-title">
                <span class="year-title-copy">Ano de nascimento <small id="year-range-description"></small></span>
                <span id="year-count" class="menu-count">0</span>
            </div>
            <div class="year-period-filters" aria-label="Disponibilidade da data de nascimento">
                <button class="year-period-btn" data-period="Sem dados" type="button">Sem dados</button>
                <button class="year-period-btn" data-period="Com dados" type="button">Com dados</button>
                <button class="year-period-btn active" data-period="Todos" type="button">Ver todos</button>
                <button id="year-reset" class="menu-reset" type="button" aria-label="Limpar filtro de ano"></button>
            </div>
            <div id="year-slider">
                <span id="value-min"></span>
                <svg id="dual-slider"></svg>
                <span id="value-max"></span>
            </div>
        </section>
        <p class="bb-description" id="bb-description" hidden></p>
    </footer>

    <script src="https://d3js.org/d3.v7.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
    <script src="js/base/core.js?v=2"></script>
    <script src="js/base/utilities.js?v=1"></script>
    <script src="js/config.js?v=4"></script>
    <script src="js/core/globals.js?v=59"></script>
    <script src="js/interface/card-scrollbar.js?v=1"></script>
    <script src="js/interface/works.js?v=2"></script>
    <script src="js/interface/interactions.js?v=120"></script>
    <script src="js/interface/messages.js?v=1"></script>
    <script src="js/graph/name-collision.js?v=7"></script>
    <script src="js/graph/renderer.js?v=86"></script>
    <script src="js/filters/engine.js?v=69"></script>

</body>
</html>
